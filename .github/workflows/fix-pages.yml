name: Repair GitHub Pages build

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/index.html

permissions:
  contents: write

jobs:
  patch-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch generated GitHub Pages HTML
        run: node scripts/patch-pages.mjs

      - name: Commit patched page
        shell: bash
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "docs/index.html is already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Fix GitHub Pages profile interactivity"
          git push
