name: Repair GitHub Pages build

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/index.html

permissions:
  contents: write

jobs:
  patch-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch generated GitHub Pages assets
        run: node scripts/patch-pages.mjs

      - name: Commit patched page
        shell: bash
        run: |
          if git diff --quiet -- docs/index.html docs/fixes.css docs/profile-access.js docs/social-upgrades.js docs/linkedin-languages.js docs/facebook-cover-upload.js app/fixes.css; then
            echo "GitHub Pages assets are already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/index.html docs/fixes.css docs/profile-access.js docs/social-upgrades.js docs/linkedin-languages.js docs/facebook-cover-upload.js app/fixes.css
          git commit -m "Deploy La Liga cover and Rizal languages"
          git push
